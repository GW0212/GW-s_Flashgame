<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>GW's Flashgame</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════
       CSS 변수
    ═══════════════════════════════════ */
    :root {
      --bg:         #f2f0ea;
      --bg2:        #e8e5dc;
      --surface:    #ffffff;
      --surface2:   #f8f6f1;
      --border:     #ccc8be;
      --border2:    #a8a49a;
      --text:       #18150e;
      --text2:      #6b6660;
      --accent:     #e03535;
      --accent2:    #ff7a00;
      --accent3:    #ffcc00;
      --glow:       rgba(224,53,53,0.20);
      --glow2:      rgba(255,122,0,0.15);
      --card-hover: #fff8f0;
      --scanline:   rgba(0,0,0,0.022);
      --shadow:     0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg:  0 8px 32px rgba(0,0,0,0.12);
      --header-bg:  rgba(242,240,234,0.93);
    }
    [data-theme="dark"] {
      --bg:         #0a0908;
      --bg2:        #131110;
      --surface:    #1e1b16;
      --surface2:   #262219;
      --border:     #3c362c;
      --border2:    #524a3e;
      --text:       #f2ece0;
      --text2:      #8a8278;
      --accent:     #ff5050;
      --accent2:    #ffaa33;
      --accent3:    #ffdd44;
      --glow:       rgba(255,80,80,0.26);
      --glow2:      rgba(255,170,51,0.20);
      --card-hover: #27221a;
      --scanline:   rgba(255,255,255,0.016);
      --shadow:     0 2px 8px rgba(0,0,0,0.45);
      --shadow-lg:  0 8px 32px rgba(0,0,0,0.60);
      --header-bg:  rgba(10,9,8,0.95);
    }

    /* ═══════════════════════════════════
       리셋 & 기본
    ═══════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.35s, color 0.35s;
    }

    /* 스캔라인 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, var(--scanline) 0px, var(--scanline) 1px,
        transparent 1px, transparent 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* 별 캔버스 */
    #starCanvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* header 제거됨 */

    /* 다크 토글 */
    .theme-toggle {
      cursor: pointer;
      background: var(--surface);
      border: 2px solid var(--border2);
      border-radius: 20px;
      width: 52px; height: 28px;
      position: relative;
      flex-shrink: 0;
      transition: border-color 0.2s, background 0.35s;
    }
    .theme-toggle:hover { border-color: var(--accent); }
    .theme-toggle .t-sun  { position:absolute; left:6px;  top:50%; transform:translateY(-50%); font-size:12px; pointer-events:none; }
    .theme-toggle .t-moon { position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:11px; pointer-events:none; }
    .toggle-knob {
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    [data-theme="dark"] .toggle-knob { transform: translateX(24px); }

    /* 제목 아래 / 검색창 위 : 게임수 + 다크토글 */
    .search-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: -1rem auto 1.6rem;
      position: relative;
      z-index: 2;
    }
    .game-count-inline {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--text2);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.55rem;
      transition: background 0.35s, border-color 0.35s;
      white-space: nowrap;
    }

    /* ═══════════════════════════════════
       HERO — 타이틀 버튼 중앙 정렬
    ═══════════════════════════════════ */
    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3.5rem 1.5rem 1.8rem;
      overflow: hidden;
    }
    /* 배경 글로우 */
    .hero::after {
      content: '';
      position: absolute;
      top: -40px; left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100vw);
      height: 260px;
      background: radial-gradient(ellipse, var(--glow) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    /* 픽셀 파티클 */
    .px { position: absolute; pointer-events: none; border-radius: 1px; z-index: 0; }
    .px1 { top:14px; left:5%;   width:10px; height:10px; background:var(--accent);  animation:pfloat 3.2s ease-in-out infinite; }
    .px2 { top:50px; right:7%;  width: 6px; height: 6px; background:var(--accent2); animation:pfloat 2.5s ease-in-out infinite 0.4s; }
    .px3 { bottom:20px; left:16%; width:8px; height:8px; background:var(--accent3); animation:pfloat 4s ease-in-out infinite 0.8s; }
    .px4 { top:70px; left:22%;  width:5px; height:5px; background:var(--accent);  animation:pfloat 2.8s ease-in-out infinite 1.1s; }
    .px5 { bottom:25px; right:18%; width:7px; height:7px; background:var(--accent2); animation:pfloat 3.6s ease-in-out infinite 0.2s; }
    @keyframes pfloat {
      0%,100% { transform:translateY(0) rotate(0deg); opacity:.3; }
      50%     { transform:translateY(-12px) rotate(45deg); opacity:.9; }
    }

    /* 타이틀 버튼 — 중앙 정렬, 클릭 시 초기화 */
    .hero-title-btn {
      position: relative;
      z-index: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1rem, 3.2vw, 2rem);
      line-height: 1.5;
      cursor: pointer;
      background: var(--surface);
      border: 3px solid var(--border2);
      border-radius: 10px;
      padding: clamp(0.9rem, 2.5vw, 1.4rem) clamp(1.4rem, 4vw, 2.8rem);
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.13s, background 0.2s;
      box-shadow: 5px 5px 0 var(--border), var(--shadow);
    }
    .hero-title-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--glow), 5px 5px 0 var(--accent2);
      background: var(--surface2);
      transform: translateY(-2px);
    }
    .hero-title-btn:active { transform: scale(0.97) translateY(0); }
    [data-theme="dark"] .hero-title-btn {
      box-shadow: 5px 5px 0 var(--border2), var(--shadow-lg);
    }
    [data-theme="dark"] .hero-title-btn:hover {
      box-shadow: 0 0 0 4px var(--glow), 5px 5px 0 var(--accent2), var(--shadow-lg);
    }

    .title-gw    { color: var(--accent2); text-shadow: 2px 2px 0 rgba(0,0,0,0.12); }
    .title-apos  { color: var(--text2); }
    .title-flash {
      color: var(--accent);
      text-shadow: 2px 2px 0 var(--accent2);
      animation: flicker 4s infinite;
    }
    .title-game  { color: var(--text); }
    @keyframes flicker {
      0%,92%,96%,100% { opacity:1; }
      93% { opacity:.55; }
      94% { opacity:1; }
      95% { opacity:.35; }
    }

    /* ═══════════════════════════════════
       검색바
    ═══════════════════════════════════ */
    .controls {
      position: relative; z-index: 2;
      max-width: 540px;
      margin: 0 auto 2.5rem;
      padding: 0 1.5rem;
    }
    .search-wrap {
      position: relative;
      filter: drop-shadow(0 4px 10px var(--glow2));
    }
    .search-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem; pointer-events: none; z-index: 1;
    }
    #searchInput {
      width: 100%;
      padding: 0.82rem 2.8rem 0.82rem 2.8rem;
      border: 2px solid var(--border2);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.35s;
      box-shadow: var(--shadow);
      -webkit-appearance: none;
    }
    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--glow), var(--shadow-lg);
    }
    #searchInput::placeholder { color: var(--text2); }
    #clearBtn {
      position: absolute; right: 11px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text2); cursor: pointer;
      font-size: 1rem; line-height: 1; padding: 5px;
      display: none; border-radius: 3px;
      transition: color 0.15s;
      touch-action: manipulation;
    }
    #clearBtn:hover { color: var(--accent); }
    #clearBtn.visible { display: block; }



    /* ═══════════════════════════════════
       장르 필터
    ═══════════════════════════════════ */
    .genre-filter-wrap {
      position: relative;
      z-index: 2;
      max-width: 1360px;
      margin: -1rem auto 2rem;
      padding: 0 1.5rem;
    }
    .genre-filter-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      margin-bottom: 0.9rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      color: var(--text2);
      letter-spacing: 0.12em;
    }
    .genre-filter-head .dot { color: var(--accent); }
    .genre-filter {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      scroll-behavior: smooth;
      overscroll-behavior-x: contain;
    }
    .genre-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 34px;
      padding: 0.48rem 0.72rem;
      border: 2px solid var(--border2);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 2px 2px 0 var(--border);
      transition: transform 0.12s, background 0.18s, color 0.18s, border-color 0.18s, box-shadow 0.18s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .genre-btn:focus-visible {
      outline: 3px solid var(--glow);
      outline-offset: 3px;
    }
    .genre-btn:hover {
      border-color: var(--accent);
      background: var(--card-hover);
      box-shadow: 2px 2px 0 var(--accent2), 0 0 0 3px var(--glow);
      transform: translateY(-1px);
    }
    .genre-btn.active {
      border-color: var(--accent);
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 3px 3px 0 var(--border2), 0 4px 14px var(--glow);
    }
    .genre-btn:active { transform: scale(0.96); }
    .genre-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 0.35rem;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--accent);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.46rem;
      line-height: 1;
    }
    .genre-btn.active .genre-count {
      background: rgba(255,255,255,0.22);
      color: #fff;
    }
    .section-current-genre {
      color: var(--accent2);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 0.28rem 0.6rem;
      box-shadow: 2px 2px 0 var(--border);
      white-space: nowrap;
    }

    /* ═══════════════════════════════════
       정렬 필터
    ═══════════════════════════════════ */
    .sort-filter-wrap {
      position: relative;
      z-index: 2;
      max-width: 1360px;
      margin: -1.15rem auto 1.8rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .section-label .sort-filter-wrap {
      max-width: none;
      margin: 0 0 0 auto;
      padding: 0;
      justify-content: flex-end;
      gap: 0;
      flex: 0 1 auto;
    }
    .sort-filter-head {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.48rem;
      color: var(--text2);
      letter-spacing: 0.12em;
      white-space: nowrap;
    }
    .sort-filter-head .dot { color: var(--accent); }
    .sort-filter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.35rem;
      border: 2px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 2px 2px 0 var(--border);
    }
    .section-label .sort-filter {
      box-shadow: 2px 2px 0 var(--border);
    }
    .sort-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0.38rem 0.65rem;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--text2);
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.76rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
      transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.12s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .sort-btn:hover {
      color: var(--accent);
      background: var(--card-hover);
      border-color: var(--border2);
    }
    .sort-btn.active {
      color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-color: var(--accent);
      box-shadow: 0 3px 10px var(--glow);
    }
    .sort-btn:focus-visible {
      outline: 3px solid var(--glow);
      outline-offset: 3px;
    }
    .sort-btn:active { transform: scale(0.96); }
    .card-genre {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 0.3rem;
      max-width: 100%;
      padding: 0.22rem 0.48rem;
      border: 1px solid var(--border2);
      border-radius: 999px;
      background: var(--surface2);
      color: var(--accent2);
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-genre::before {
      content: '◆';
      color: var(--accent);
      font-size: 0.58rem;
    }

    /* ═══════════════════════════════════
       섹션 라벨 — "✦ N CLASSIC FLASH GAMES ✦"
    ═══════════════════════════════════ */
    .grid-section {
      position: relative; z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }
    .section-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.56rem;
      color: var(--text2);
      letter-spacing: 0.16em;
      margin-bottom: 1.4rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      transition: border-color 0.35s;
    }
    .section-summary {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      min-width: 0;
    }
    .section-divider {
      color: var(--border2);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      line-height: 1;
    }
    .lbl-arrow { color: var(--accent); animation: arrow-pulse 1.5s ease-in-out infinite; }
    @keyframes arrow-pulse { 0%,100%{transform:translateX(0)} 50%{transform:translateX(3px)} }

    /* 카운트 배지 */
    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      color: var(--accent2);
      background: var(--surface);
      border: 2px solid var(--border2);
      border-radius: 4px;
      padding: 0.28rem 0.65rem;
      letter-spacing: 0.12em;
      box-shadow: 2px 2px 0 var(--border);
      white-space: nowrap;
    }
    [data-theme="dark"] .count-badge {
      box-shadow: 2px 2px 0 var(--accent2);
      border-color: var(--accent2);
      color: var(--accent2);
    }
    .count-badge .star { color: var(--accent); }
    #resultCount { color: var(--accent); }

    /* ═══════════════════════════════════
       게임 그리드
    ═══════════════════════════════════ */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.2rem;
    }

    /* ═══════════════════════════════════
       게임 카드
    ═══════════════════════════════════ */
    .game-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition:
        transform 0.2s cubic-bezier(.2,.8,.3,1),
        border-color 0.2s, box-shadow 0.2s, background 0.2s;
      animation: cardIn 0.38s ease both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(14px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    [data-theme="dark"] .game-card {
      border-color: var(--border2);
      box-shadow: 0 1px 6px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .game-card:hover {
      transform: translateY(-5px) scale(1.013);
      border-color: var(--accent);
      box-shadow: 0 10px 28px var(--glow), 4px 4px 0 var(--accent2);
      background: var(--card-hover);
    }
    [data-theme="dark"] .game-card:hover {
      box-shadow: 0 10px 36px var(--glow), 3px 3px 0 var(--accent2), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* 상단 컬러 바 */
    .game-card::before {
      content: '';
      position: absolute; top:0; left:0; right:0; height:3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.28s ease; z-index: 2;
    }
    .game-card:hover::before { transform: scaleX(1); }

    /* 썸네일 — 클릭 가능한 링크로 감쌈 */
    .card-thumb-link {
      display: block;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--bg2);
      position: relative;
      text-decoration: none;
      flex-shrink: 0;
    }
    [data-theme="dark"] .card-thumb-link {
      border-bottom: 1px solid var(--border2);
    }
    .card-thumb-link img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.32s ease;
    }
    .game-card:hover .card-thumb-link img { transform: scale(1.07); }

    /* 썸네일 호버 오버레이 */
    .card-thumb-link::after {
      content: '▶ PLAY';
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.50);
      color: #fff;
      opacity: 0;
      transition: opacity 0.22s;
      letter-spacing: 0.12em;
      text-shadow: 2px 2px 0 var(--accent2);
    }
    .game-card:hover .card-thumb-link::after { opacity: 1; }

    /* fallback */
    .thumb-fallback {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.5rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.42rem;
      color: var(--text2);
      background: var(--bg2);
    }
    .thumb-fallback .fi { font-size: 2rem; }

    /* 카드 바디 */
    .card-body {
      padding: 0.8rem 0.9rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .card-title {
      font-weight: 700;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text);
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

/* ═══════════════════════════════════

═══════════════════════════════════ */
(function() {
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  const COUNT = 70;
  const stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  for (let i = 0; i < COUNT; i++) {
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.5 + 0.3,
      o: Math.random(),
      s: (Math.random() - 0.5) * 0.3,
      dx: (Math.random() - 0.5) * 0.18,
      dy: (Math.random() - 0.5) * 0.13,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    stars.forEach(s => {
      s.o += s.s * 0.02;
      if (s.o > 1) { s.o = 1; s.s = -Math.abs(s.s); }
      if (s.o < 0) { s.o = 0; s.s =  Math.abs(s.s); }
      s.x = (s.x + s.dx + canvas.width)  % canvas.width;
      s.y = (s.y + s.dy + canvas.height) % canvas.height;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = dark
        ? `rgba(255,200,120,${s.o * 0.75})`
        : `rgba(190,130,70,${s.o * 0.40})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

const grid    = document.getElementById('gameGrid');
const empty   = document.getElementById('emptyState');
const countEl = document.getElementById('resultCount');
const genreFilter = document.getElementById('genreFilter');
const sortFilter = document.getElementById('sortFilter');
const activeGenreLabel = document.getElementById('activeGenreLabel');
const mobilePlayToast = document.getElementById('mobilePlayToast');
const ALL_GENRE = '전체';
const SORT_OPTIONS = [
  { key: 'default', label: '전체' },
  { key: 'title', label: '가나다순' },
  { key: 'genre', label: '장르순' },
  { key: 'popular', label: '인기순' },
];
const POPULAR_TITLES = [
  '슈퍼마리오 63', '팔라독', '전쟁시대 1', '풍선타워디펜스 5', '풍선타워디펜스 4',
  '메탈 슬러그 3 브루탈', '메탈 슬러그 디펜스', '박스헤드 2인용', '감옥탈출 리마스터',
  '아이탈출 4', '보글보글2', '소닉 더 헤지혹', '카오스팩션1', '아빠와 나', '슈의 라면가게',
  '식물 vs 좀비', '앵그리 버드', '슈퍼 마리오 플래시 2', '2048', '스네이크', '체스', '팩맨 어드벤스드'
];
const popularRank = new Map(POPULAR_TITLES.map((title, index) => [title, index]));
let activeGenre = ALL_GENRE;
let activeSort = 'default';
let toastTimer = null;

function renderCards(list) {
  grid.innerHTML = '';
  countEl.textContent = list.length;

  if (!list.length) { empty.classList.add('show'); return; }
  empty.classList.remove('show');

  list.forEach((game, i) => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.style.animationDelay = `${Math.min(i * 0.028, 0.5)}s`;

    card.innerHTML = `
      <a class="card-thumb-link" href="${game.url}" target="_blank" rel="noopener" aria-label="${game.title} 플레이">
        <img
          src="${game.icon}"
          alt="${game.title} 썸네일"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        />
        <div class="thumb-fallback" style="display:none;">
          <div class="fi">🕹️</div>
          <div>${game.title}</div>
        </div>
      </a>
      <div class="card-body">
        <div class="card-genre">${game.genre}</div>
        <div class="card-title">${game.title}</div>
        <div class="card-footer">
          <a class="play-btn" href="${game.url}" target="_blank" rel="noopener">▶ PLAY</a>
        </div>
      </div>
    `;
    card.querySelectorAll('.card-thumb-link, .play-btn').forEach((link) => {
      link.addEventListener('pointerdown', showMobilePlayToast, { passive: true });
      link.addEventListener('click', showMobilePlayToast, { passive: true });
    });
    grid.appendChild(card);
  });
}

/* ═══════════════════════════════════
   검색 (스크롤 고정)
═══════════════════════════════════ */
const searchInput = document.getElementById('searchInput');
const clearBtn    = document.getElementById('clearBtn');

function getGenreList() {
  return [ALL_GENRE, ...new Set(GAMES.map(game => game.genre))];
}

function getGenreCount(genre) {
  return genre === ALL_GENRE ? GAMES.length : GAMES.filter(game => game.genre === genre).length;
}

function renderGenreButtons() {
  genreFilter.innerHTML = '';
  getGenreList().forEach((genre) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'genre-btn';
    btn.setAttribute('aria-pressed', genre === activeGenre ? 'true' : 'false');
    btn.setAttribute('aria-label', `${genre} 장르 보기`);
    btn.dataset.genre = genre;
    btn.innerHTML = `${genre}<span class="genre-count">${getGenreCount(genre)}</span>`;
    btn.addEventListener('click', (event) => {
      event.preventDefault();
      activeGenre = (genre !== ALL_GENRE && activeGenre === genre) ? ALL_GENRE : genre;
      applyFilters({ preserveScroll: true, centerGenre: true });
    });
    genreFilter.appendChild(btn);
  });
}

function renderSortButtons() {
  sortFilter.innerHTML = '';
  SORT_OPTIONS.forEach((option) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sort-btn';
    btn.dataset.sort = option.key;
    btn.textContent = option.label;
    btn.setAttribute('aria-pressed', option.key === activeSort ? 'true' : 'false');
    btn.setAttribute('aria-label', `${option.label} 정렬`);
    btn.addEventListener('click', (event) => {
      event.preventDefault();
      activeSort = (option.key !== 'default' && activeSort === option.key) ? 'default' : option.key;
      applyFilters({ preserveScroll: true });
    });
    sortFilter.appendChild(btn);
  });
}

function sortGames(list) {
  const sorted = [...list];
  const originalIndex = (game) => GAMES.indexOf(game);
  const byTitle = (a, b) => a.title.localeCompare(b.title, 'ko-KR') || originalIndex(a) - originalIndex(b);

  if (activeSort === 'title') {
    sorted.sort(byTitle);
  } else if (activeSort === 'genre') {
    sorted.sort((a, b) => a.genre.localeCompare(b.genre, 'ko-KR') || byTitle(a, b));
  } else if (activeSort === 'popular') {
    sorted.sort((a, b) => {
      const rankA = popularRank.has(a.title) ? popularRank.get(a.title) : 999 + originalIndex(a);
      const rankB = popularRank.has(b.title) ? popularRank.get(b.title) : 999 + originalIndex(b);
      return rankA - rankB;
    });
  }
  return sorted;
}

function getFilteredGames() {
  const q = searchInput.value.trim().toLowerCase();
  const filtered = GAMES.filter((game) => {
    const matchesGenre = activeGenre === ALL_GENRE || game.genre === activeGenre;
    const matchesSearch = !q || game.title.toLowerCase().includes(q) || game.genre.toLowerCase().includes(q);
    return matchesGenre && matchesSearch;
  });
  return sortGames(filtered);
}

function updateGenreUI() {
  document.querySelectorAll('.genre-btn').forEach((btn) => {
    const selected = btn.dataset.genre === activeGenre;
    btn.classList.toggle('active', selected);
    btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
  });
  activeGenreLabel.textContent = activeGenre;
}

function updateSortUI() {
  document.querySelectorAll('.sort-btn').forEach((btn) => {
    const selected = btn.dataset.sort === activeSort;
    btn.classList.toggle('active', selected);
    btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
  });
}

function centerActiveGenreButton() {
  const activeBtn = genreFilter.querySelector('.genre-btn.active');
  if (!activeBtn || genreFilter.scrollWidth <= genreFilter.clientWidth + 4) return;

  const nextLeft = activeBtn.offsetLeft - (genreFilter.clientWidth - activeBtn.offsetWidth) / 2;
  genreFilter.scrollTo({
    left: Math.max(0, nextLeft),
    behavior: 'smooth'
  });
}

function showMobilePlayToast() {
  if (!window.matchMedia('(max-width: 768px)').matches || !mobilePlayToast) return;
  mobilePlayToast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    mobilePlayToast.classList.remove('show');
  }, 2100);
}

function applyFilters(options = {}) {
  const sy = window.scrollY;
  clearBtn.classList.toggle('visible', searchInput.value.trim().length > 0);
  renderCards(getFilteredGames());
  updateGenreUI();
  updateSortUI();

  // 장르/정렬 변경 시 화면이 강제로 아래로 이동하지 않도록 현재 세로 위치를 유지합니다.
  if (options.preserveScroll) {
    window.scrollTo(0, sy);
    requestAnimationFrame(() => {
      if (options.centerGenre) centerActiveGenreButton();
      window.scrollTo(0, sy);
    });
  } else if (options.centerGenre) {
    requestAnimationFrame(centerActiveGenreButton);
  }
}

searchInput.addEventListener('input', () => {
  applyFilters({ preserveScroll: true });
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  applyFilters({ preserveScroll: true });
  searchInput.focus();
});

/* ═══════════════════════════════════
   초기화 (로고 / 타이틀 버튼)
═══════════════════════════════════ */
function resetAll() {
  searchInput.value = '';
  activeGenre = ALL_GENRE;
  activeSort = 'default';
  clearBtn.classList.remove('visible');
  applyFilters({ preserveScroll: false, centerGenre: true });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.getElementById('heroTitleBtn').addEventListener('click', resetAll);

const themeToggle = document.getElementById('themeToggle');

function setTheme(dark) {
  html.setAttribute('data-theme', dark ? 'dark' : 'light');
  localStorage.setItem('gw-flashgame-theme', dark ? 'dark' : 'light');
}
themeToggle.addEventListener('click', () => setTheme(html.getAttribute('data-theme') !== 'dark'));
setTheme((localStorage.getItem('gw-flashgame-theme') || 'light') === 'dark');

  toTopBtn.classList.toggle('visible', window.scrollY > 400);
}, { passive: true });
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

renderGenreButtons();
renderSortButtons();
applyFilters({ centerGenre: true });
