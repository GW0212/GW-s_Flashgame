<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>GW's Flashgame</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    /* ═══════════════════════════════════
       CSS 변수
    ═══════════════════════════════════ */
    :root {
      --bg:         #f2f0ea;
      --bg2:        #e8e5dc;
      --surface:    #ffffff;
      --surface2:   #f8f6f1;
      --border:     #ccc8be;
      --border2:    #a8a49a;
      --text:       #18150e;
      --text2:      #6b6660;
      --accent:     #e03535;
      --accent2:    #ff7a00;
      --accent3:    #ffcc00;
      --glow:       rgba(224,53,53,0.20);
      --glow2:      rgba(255,122,0,0.15);
      --card-hover: #fff8f0;
      --scanline:   rgba(0,0,0,0.022);
      --shadow:     0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg:  0 8px 32px rgba(0,0,0,0.12);
      --header-bg:  rgba(242,240,234,0.93);
    }
    [data-theme="dark"] {
      --bg:         #0a0908;
      --bg2:        #131110;
      --surface:    #1e1b16;
      --surface2:   #262219;
      --border:     #3c362c;
      --border2:    #524a3e;
      --text:       #f2ece0;
      --text2:      #8a8278;
      --accent:     #ff5050;
      --accent2:    #ffaa33;
      --accent3:    #ffdd44;
      --glow:       rgba(255,80,80,0.26);
      --glow2:      rgba(255,170,51,0.20);
      --card-hover: #27221a;
      --scanline:   rgba(255,255,255,0.016);
      --shadow:     0 2px 8px rgba(0,0,0,0.45);
      --shadow-lg:  0 8px 32px rgba(0,0,0,0.60);
      --header-bg:  rgba(10,9,8,0.95);
    }

    /* ═══════════════════════════════════
       리셋 & 기본
    ═══════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.35s, color 0.35s;
    }

    /* 스캔라인 */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, var(--scanline) 0px, var(--scanline) 1px,
        transparent 1px, transparent 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* 별 캔버스 */
    #starCanvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* header 제거됨 */

    /* 다크 토글 */
    .theme-toggle {
      cursor: pointer;
      background: var(--surface);
      border: 2px solid var(--border2);
      border-radius: 20px;
      width: 52px; height: 28px;
      position: relative;
      flex-shrink: 0;
      transition: border-color 0.2s, background 0.35s;
    }
    .theme-toggle:hover { border-color: var(--accent); }
    .theme-toggle .t-sun  { position:absolute; left:6px;  top:50%; transform:translateY(-50%); font-size:12px; pointer-events:none; }
    .theme-toggle .t-moon { position:absolute; right:6px; top:50%; transform:translateY(-50%); font-size:11px; pointer-events:none; }
    .toggle-knob {
      position: absolute;
      top: 3px; left: 3px;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    [data-theme="dark"] .toggle-knob { transform: translateX(24px); }

    /* 제목 아래 / 검색창 위 : 게임수 + 다크토글 */
    .search-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: -1rem auto 1.6rem;
      position: relative;
      z-index: 2;
    }
    .game-count-inline {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.55rem;
      color: var(--text2);
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 0.3rem 0.55rem;
      transition: background 0.35s, border-color 0.35s;
      white-space: nowrap;
    }

    /* ═══════════════════════════════════
       HERO — 타이틀 버튼 중앙 정렬
    ═══════════════════════════════════ */
    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3.5rem 1.5rem 1.8rem;
      overflow: hidden;
    }
    /* 배경 글로우 */
    .hero::after {
      content: '';
      position: absolute;
      top: -40px; left: 50%;
      transform: translateX(-50%);
      width: min(700px, 100vw);
      height: 260px;
      background: radial-gradient(ellipse, var(--glow) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
    }

    /* 픽셀 파티클 */
    .px { position: absolute; pointer-events: none; border-radius: 1px; z-index: 0; }
    .px1 { top:14px; left:5%;   width:10px; height:10px; background:var(--accent);  animation:pfloat 3.2s ease-in-out infinite; }
    .px2 { top:50px; right:7%;  width: 6px; height: 6px; background:var(--accent2); animation:pfloat 2.5s ease-in-out infinite 0.4s; }
    .px3 { bottom:20px; left:16%; width:8px; height:8px; background:var(--accent3); animation:pfloat 4s ease-in-out infinite 0.8s; }
    .px4 { top:70px; left:22%;  width:5px; height:5px; background:var(--accent);  animation:pfloat 2.8s ease-in-out infinite 1.1s; }
    .px5 { bottom:25px; right:18%; width:7px; height:7px; background:var(--accent2); animation:pfloat 3.6s ease-in-out infinite 0.2s; }
    @keyframes pfloat {
      0%,100% { transform:translateY(0) rotate(0deg); opacity:.3; }
      50%     { transform:translateY(-12px) rotate(45deg); opacity:.9; }
    }

    /* 타이틀 버튼 — 중앙 정렬, 클릭 시 초기화 */
    .hero-title-btn {
      position: relative;
      z-index: 1;
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1rem, 3.2vw, 2rem);
      line-height: 1.5;
      cursor: pointer;
      background: var(--surface);
      border: 3px solid var(--border2);
      border-radius: 10px;
      padding: clamp(0.9rem, 2.5vw, 1.4rem) clamp(1.4rem, 4vw, 2.8rem);
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.13s, background 0.2s;
      box-shadow: 5px 5px 0 var(--border), var(--shadow);
    }
    .hero-title-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--glow), 5px 5px 0 var(--accent2);
      background: var(--surface2);
      transform: translateY(-2px);
    }
    .hero-title-btn:active { transform: scale(0.97) translateY(0); }
    [data-theme="dark"] .hero-title-btn {
      box-shadow: 5px 5px 0 var(--border2), var(--shadow-lg);
    }
    [data-theme="dark"] .hero-title-btn:hover {
      box-shadow: 0 0 0 4px var(--glow), 5px 5px 0 var(--accent2), var(--shadow-lg);
    }

    .title-gw    { color: var(--accent2); text-shadow: 2px 2px 0 rgba(0,0,0,0.12); }
    .title-apos  { color: var(--text2); }
    .title-flash {
      color: var(--accent);
      text-shadow: 2px 2px 0 var(--accent2);
      animation: flicker 4s infinite;
    }
    .title-game  { color: var(--text); }
    @keyframes flicker {
      0%,92%,96%,100% { opacity:1; }
      93% { opacity:.55; }
      94% { opacity:1; }
      95% { opacity:.35; }
    }

    /* ═══════════════════════════════════
       검색바
    ═══════════════════════════════════ */
    .controls {
      position: relative; z-index: 2;
      max-width: 540px;
      margin: 0 auto 2.5rem;
      padding: 0 1.5rem;
    }
    .search-wrap {
      position: relative;
      filter: drop-shadow(0 4px 10px var(--glow2));
    }
    .search-icon {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem; pointer-events: none; z-index: 1;
    }
    #searchInput {
      width: 100%;
      padding: 0.82rem 2.8rem 0.82rem 2.8rem;
      border: 2px solid var(--border2);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.35s;
      box-shadow: var(--shadow);
      -webkit-appearance: none;
    }
    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--glow), var(--shadow-lg);
    }
    #searchInput::placeholder { color: var(--text2); }
    #clearBtn {
      position: absolute; right: 11px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text2); cursor: pointer;
      font-size: 1rem; line-height: 1; padding: 5px;
      display: none; border-radius: 3px;
      transition: color 0.15s;
      touch-action: manipulation;
    }
    #clearBtn:hover { color: var(--accent); }
    #clearBtn.visible { display: block; }

    /* ═══════════════════════════════════
       섹션 라벨 — "✦ N CLASSIC FLASH GAMES ✦"
    ═══════════════════════════════════ */
    .grid-section {
      position: relative; z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }
    .section-label {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.56rem;
      color: var(--text2);
      letter-spacing: 0.16em;
      margin-bottom: 1.4rem;
      padding-bottom: 0.8rem;
      border-bottom: 2px solid var(--border);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      transition: border-color 0.35s;
    }
    .lbl-arrow { color: var(--accent); animation: arrow-pulse 1.5s ease-in-out infinite; }
    @keyframes arrow-pulse { 0%,100%{transform:translateX(0)} 50%{transform:translateX(3px)} }

    /* 카운트 배지 */
    .count-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.52rem;
      color: var(--accent2);
      background: var(--surface);
      border: 2px solid var(--border2);
      border-radius: 4px;
      padding: 0.28rem 0.65rem;
      letter-spacing: 0.12em;
      box-shadow: 2px 2px 0 var(--border);
      white-space: nowrap;
    }
    [data-theme="dark"] .count-badge {
      box-shadow: 2px 2px 0 var(--accent2);
      border-color: var(--accent2);
      color: var(--accent2);
    }
    .count-badge .star { color: var(--accent); }
    #resultCount { color: var(--accent); }

    /* ═══════════════════════════════════
       게임 그리드
    ═══════════════════════════════════ */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 1.2rem;
    }

    /* ═══════════════════════════════════
       게임 카드
    ═══════════════════════════════════ */
    .game-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition:
        transform 0.2s cubic-bezier(.2,.8,.3,1),
        border-color 0.2s, box-shadow 0.2s, background 0.2s;
      animation: cardIn 0.38s ease both;
    }
    @keyframes cardIn {
      from { opacity:0; transform:translateY(14px) scale(0.97); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }
    [data-theme="dark"] .game-card {
      border-color: var(--border2);
      box-shadow: 0 1px 6px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .game-card:hover {
      transform: translateY(-5px) scale(1.013);
      border-color: var(--accent);
      box-shadow: 0 10px 28px var(--glow), 4px 4px 0 var(--accent2);
      background: var(--card-hover);
    }
    [data-theme="dark"] .game-card:hover {
      box-shadow: 0 10px 36px var(--glow), 3px 3px 0 var(--accent2), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    /* 상단 컬러 바 */
    .game-card::before {
      content: '';
      position: absolute; top:0; left:0; right:0; height:3px;
      background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.28s ease; z-index: 2;
    }
    .game-card:hover::before { transform: scaleX(1); }

    /* 썸네일 — 클릭 가능한 링크로 감쌈 */
    .card-thumb-link {
      display: block;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--bg2);
      position: relative;
      text-decoration: none;
      flex-shrink: 0;
    }
    [data-theme="dark"] .card-thumb-link {
      border-bottom: 1px solid var(--border2);
    }
    .card-thumb-link img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.32s ease;
    }
    .game-card:hover .card-thumb-link img { transform: scale(1.07); }

    /* 썸네일 호버 오버레이 */
    .card-thumb-link::after {
      content: '▶ PLAY';
      font-family: 'Press Start 2P', monospace;
      font-size: 0.58rem;
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.50);
      color: #fff;
      opacity: 0;
      transition: opacity 0.22s;
      letter-spacing: 0.12em;
      text-shadow: 2px 2px 0 var(--accent2);
    }
    .game-card:hover .card-thumb-link::after { opacity: 1; }

    /* fallback */
    .thumb-fallback {
      position: absolute; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.5rem;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.42rem;
      color: var(--text2);
      background: var(--bg2);
    }
    .thumb-fallback .fi { font-size: 2rem; }

    /* 카드 바디 */
    .card-body {
      padding: 0.8rem 0.9rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .card-title {
      font-weight: 700;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--text);
      word-break: keep-all;
    }
    .card-footer { margin-top: auto; }
    .play-btn {
      display: block; width: 100%;
      padding: 0.58rem 0;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff;
      border: none; border-radius: 5px;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      letter-spacing: 0.12em;
      cursor: pointer;
      text-decoration: none; text-align: center;
      transition: filter 0.15s, transform 0.1s, box-shadow 0.15s;
      position: relative; overflow: hidden;
      touch-action: manipulation;
    }
    [data-theme="dark"] .play-btn {
      box-shadow: 0 2px 8px rgba(255,80,80,0.32), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .play-btn::before {
      content: '';
      position: absolute; top:0; left:-100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: skewX(-18deg);
      transition: left 0.5s;
    }
    .game-card:hover .play-btn::before { left: 140%; }
    .play-btn:hover { filter: brightness(1.12); box-shadow: 0 4px 14px var(--glow); }
    .play-btn:active { transform: scale(0.96); }

    /* ═══════════════════════════════════
       빈 결과
    ═══════════════════════════════════ */
    .empty-state { text-align: center; padding: 5rem 2rem; display: none; }
    .empty-state.show { display: block; }
    .empty-emoji { font-size: 2.8rem; margin-bottom: 1.4rem; animation: pfloat 2.5s ease-in-out infinite; }
    .empty-state p {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.6rem;
      color: var(--text2);
      line-height: 2.6;
    }

    /* ═══════════════════════════════════
       맨 위로 버튼
    ═══════════════════════════════════ */
    #toTop {
      position: fixed; bottom: 1.5rem; right: 1.5rem;
      z-index: 400;
      width: 44px; height: 44px;
      background: var(--accent);
      border: 2px solid var(--border2);
      border-radius: 6px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.25s, transform 0.25s, background 0.15s, box-shadow 0.15s;
      pointer-events: none;
      box-shadow: 3px 3px 0 var(--accent2);
      touch-action: manipulation;
    }
    #toTop.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    #toTop:hover { background: var(--accent2); box-shadow: 3px 3px 0 var(--accent); }
    #toTop:active { transform: scale(0.94); }

    /* ═══════════════════════════════════
       FOOTER
    ═══════════════════════════════════ */
    footer {
      position: relative; z-index: 1;
      border-top: 2px solid var(--border);
      padding: 1.6rem 1.5rem;
      text-align: center;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.46rem;
      color: var(--text2);
      letter-spacing: 0.12em;
      background: var(--bg2);
      transition: background 0.35s, border-color 0.35s;
    }
    footer .heart { color: var(--accent); animation: heartbeat 1.2s ease-in-out infinite; display: inline-block; }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      30%     { transform: scale(1.32); }
      60%     { transform: scale(1); }
      80%     { transform: scale(1.16); }
    }

    /* ═══════════════════════════════════
       모바일 반응형
    ═══════════════════════════════════ */
    /* 태블릿 */
    @media (max-width: 768px) {
      .game-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
      .hero { padding: 3rem 1.5rem 2.5rem; }
    }

    /* 모바일 */
    @media (max-width: 520px) {
      header { padding: 1rem 0.9rem 0; }
      .logo-btn { font-size: 0.65rem; padding: 0.38rem 0.65rem; gap: 4px; }
      .logo-sub { font-size: 0.32rem; }
      .game-count-inline { font-size: 0.48rem; }

      .hero { padding: 2.5rem 1rem 2rem; }
      .hero-title-btn {
        font-size: clamp(0.8rem, 5.5vw, 1.1rem);
        padding: 0.9rem 1.2rem;
        border-radius: 8px;
      }

      .controls { padding: 0 1rem; margin-bottom: 2rem; }
      #searchInput { font-size: 0.88rem; padding: 0.78rem 2.6rem; }

      .grid-section { padding: 0 0.9rem 3rem; }
      .section-label { font-size: 0.48rem; gap: 0.5rem; }
      .count-badge { font-size: 0.44rem; padding: 0.24rem 0.5rem; }
      .game-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }

      .card-body { padding: 0.65rem 0.75rem; gap: 0.5rem; }
      .card-title { font-size: 0.75rem; }
      .play-btn { font-size: 0.44rem; padding: 0.52rem 0; }

      #toTop { bottom: 1rem; right: 1rem; width: 40px; height: 40px; font-size: 0.58rem; }
      footer { font-size: 0.4rem; padding: 1.2rem 1rem; }
    }

    /* 아주 작은 화면 */
    @media (max-width: 360px) {
      .game-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
      .hero-title-btn { font-size: 0.72rem; }
    }
  </style>
</head>
<body>

<canvas id="starCanvas"></canvas>



<!-- ══════════ HERO — 타이틀 버튼 중앙 ══════════ -->
<section class="hero">
  <div class="px px1"></div>
  <div class="px px2"></div>
  <div class="px px3"></div>
  <div class="px px4"></div>
  <div class="px px5"></div>
  <button class="hero-title-btn" id="heroTitleBtn" aria-label="홈으로 초기화">
    <span class="title-gw">GW</span><span class="title-apos">'s </span><span class="title-flash">Flash</span><span class="title-game">game</span>
  </button>
</section>

<!-- 제목 아래 / 검색창 위 : 게임 수 + 다크토글 -->
<div class="search-meta">
  <div class="game-count-inline" id="headerCount">43 GAMES</div>
  <button class="theme-toggle" id="themeToggle" title="다크/라이트 전환" aria-label="테마 전환">
    <span class="t-sun">☀</span>
    <span class="t-moon">🌙</span>
    <div class="toggle-knob"></div>

/* ═══════════════════════════════════
   별 파티클
═══════════════════════════════════ */
(function() {
  const canvas = document.getElementById('starCanvas');
  const ctx = canvas.getContext('2d');
  const COUNT = 70;
  const stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  for (let i = 0; i < COUNT; i++) {
    stars.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.5 + 0.3,
      o: Math.random(),
      s: (Math.random() - 0.5) * 0.3,
      dx: (Math.random() - 0.5) * 0.18,
      dy: (Math.random() - 0.5) * 0.13,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    stars.forEach(s => {
      s.o += s.s * 0.02;
      if (s.o > 1) { s.o = 1; s.s = -Math.abs(s.s); }
      if (s.o < 0) { s.o = 0; s.s =  Math.abs(s.s); }
      s.x = (s.x + s.dx + canvas.width)  % canvas.width;
      s.y = (s.y + s.dy + canvas.height) % canvas.height;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = dark
        ? `rgba(255,200,120,${s.o * 0.75})`
        : `rgba(190,130,70,${s.o * 0.40})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ═══════════════════════════════════
   카드 렌더
═══════════════════════════════════ */
const grid    = document.getElementById('gameGrid');
const empty   = document.getElementById('emptyState');
const countEl = document.getElementById('resultCount');

function renderCards(list) {
  grid.innerHTML = '';
  countEl.textContent = list.length;

  if (!list.length) { empty.classList.add('show'); return; }
  empty.classList.remove('show');

  list.forEach((game, i) => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.style.animationDelay = `${Math.min(i * 0.028, 0.5)}s`;

    card.innerHTML = `
      <a class="card-thumb-link" href="${game.url}" target="_blank" rel="noopener" aria-label="${game.title} 플레이">
        <img
          src="${game.icon}"
          alt="${game.title} 썸네일"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
        />
        <div class="thumb-fallback" style="display:none;">
          <div class="fi">🕹️</div>
          <div>${game.title}</div>
        </div>
      </a>
      <div class="card-body">
        <div class="card-title">${game.title}</div>
        <div class="card-footer">
          <a class="play-btn" href="${game.url}" target="_blank" rel="noopener">▶ PLAY</a>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

const searchInput = document.getElementById('searchInput');
const clearBtn    = document.getElementById('clearBtn');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  clearBtn.classList.toggle('visible', q.length > 0);
  const sy = window.scrollY;
  renderCards(q ? GAMES.filter(g => g.title.toLowerCase().includes(q)) : GAMES);
  window.scrollTo({ top: sy, behavior: 'instant' });
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.classList.remove('visible');
  renderCards(GAMES);
  searchInput.focus();
});
